# Deploys the site with the Alchemy stack in alchemy.run.ts, through the shared deploy workflow of
# samebase/samebase: `prod` (push.tsx.md) on each push to main, `pr-<number>` on each pull request.
name: Alchemy
on:
  push: { branches: [main] }
  pull_request: { types: [opened, synchronize, reopened, closed] }
  workflow_dispatch: { inputs: { adopt: { type: boolean, default: false } } }
permissions: { contents: read, pull-requests: write }
jobs:
  alchemy:
    uses: samebase/samebase/.github/workflows/alchemy-deploy.yml@9ea716af8f62c23d958f11e67efb27bd6956b60c
    with:
      {
        adopt: "${{ inputs.adopt == true }}",
        build: npm run typecheck && npm run build,
        detect-drift: true,
      }
    secrets:
      CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
