# Deploys the site with the Alchemy stack in apps/twin/alchemy.run.ts. A push to main deploys the stage `prod`
# (push.tsx.md). A pull request from this repository deploys the stage `pr-<number>`, a Worker of its
# own on workers.dev; closing the pull request destroys that stage. This workflow never destroys
# `prod`.
#
# The state of every stage is on the branch `alchemy-state-store` of this repository
# (@samebase/alchemy-kit/github-state): `contents: write` lets a run write it with its own token, and
# the secret ALCHEMY_GITHUB_STATE_KEY seals each secret in the state. The Worker needs
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Only the Alchemy steps get the secrets; install and
# build do not.
name: Alchemy

on:
  push: { branches: [main] }
  pull_request: { types: [opened, synchronize, reopened, closed] }
  # Run once on main with adopt to take over a Worker that exists but is not in the state yet.
  workflow_dispatch: { inputs: { adopt: { type: boolean, default: false } } }

permissions: { contents: read }

# One run per stage at a time. Pending runs wait in order instead of replacing each other, so the
# destroy of a closed pull request waits for its running deploy.
concurrency:
  group: alchemy-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  queue: max
  cancel-in-progress: false

env:
  # `pr-<number>` for a pull request, `prod` on main, and the branch name otherwise, where no job
  # below runs.
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (github.ref == 'refs/heads/main' && 'prod' || github.ref_name) }}

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'pull_request' && 'the preview' || 'production' }}
    if: >-
      github.event.action != 'closed' && (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository || github.event_name !=
      'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: write }
    steps:
      # The branch head, not the default merge commit of a pull request.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      # The native modules of the local Node bridge (usb, MIDI) are not needed to build or deploy.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # A re-run of an old run must not put older code over newer code.
      - name: Check that the checkout is the head of the branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          head=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$(git rev-parse HEAD)" != "$head" ]; then
            echo "::error::The checkout is not the head of $BRANCH ($head). Nothing was deployed."
            exit 1
          fi

      - name: Build
        run: pnpm typecheck && pnpm build

      - name: Deploy
        working-directory: apps/twin
        run: node_modules/.bin/alchemy deploy --stage "$STAGE" --yes --no-input --detect-drift $ADOPT
        env:
          ADOPT: ${{ inputs.adopt && '--adopt' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          ALCHEMY_GITHUB_STATE_KEY: ${{ secrets.ALCHEMY_GITHUB_STATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  destroy:
    name: Destroy the preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    steps:
      # The base branch: its stack destroys the stage from the state.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The stage comes from the number of the pull request, so this step cannot name `prod`.
      - name: Destroy the preview
        working-directory: apps/twin
        run: node_modules/.bin/alchemy destroy --stage "pr-$NUMBER" --yes --no-input
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
          ALCHEMY_GITHUB_STATE_KEY: ${{ secrets.ALCHEMY_GITHUB_STATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
