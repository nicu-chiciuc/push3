<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Push 3 Twin</title>
  <link rel="stylesheet" href="/css/app.css" />
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo"></span>Push 3 Twin</div>
    <div class="status">
      <span class="pill" id="st-bridge">Bridge <b>…</b></span>
      <span class="pill" id="st-midi">MIDI <b>…</b></span>
      <span class="pill" id="st-display">Screen <b>…</b></span>
    </div>
    <div class="tools">
      <div class="seg">
        <button data-view="angled" class="active">Angled</button>
        <button data-view="top">Top</button>
        <button data-view="front">Front</button>
      </div>
      <label class="toggle"><input type="checkbox" id="bloom" checked /> Glow</label>
      <button id="resync" title="Re-send palette, modes and every LED to the Push">Re-sync</button>
    </div>
  </header>

  <main>
    <section id="stage" aria-label="3D model of the Push 3">
      <div id="hint" hidden></div>
      <div class="stage-help">Drag to orbit · scroll to zoom · click pads, buttons, knobs (drag up/down) and the touch strip to use them virtually</div>
    </section>

    <aside id="side">
      <nav id="tabs"></nav>
      <div id="demo-panel"></div>
      <section id="log">
        <header>
          <h3>Event log</h3>
          <span id="log-count"></span>
          <label class="toggle small"><input type="checkbox" id="log-cont" /> continuous</label>
          <button id="log-pause">Pause</button>
          <button id="log-clear">Clear</button>
        </header>
        <ul id="log-list"></ul>
      </section>
    </aside>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
