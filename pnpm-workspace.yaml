packages:
  - "apps/*"
  - "packages/*"

# Wait 7 days before resolving newly published package versions, as in the other samebase
# repositories. This gives the ecosystem time to detect and yank compromised releases.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Our own releases, which may be installed as soon as they are published.
  - "@samebase/*"

# Install scripts: the bridge's native modules (node-usb, RtMidi) need theirs; workerd (from
# Alchemy, for local Worker runs) does not, since this site deploys static assets only.
allowBuilds:
  "@julusian/midi": true
  usb: true
  workerd: false
patchedDependencies:
  signalsmith-stretch@1.3.2: patches/signalsmith-stretch@1.3.2.patch
